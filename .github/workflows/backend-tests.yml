name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./kisan_connect_ci.db
      COOKIE_SECURE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Starlette's current TestClient requires httpx2.
          pip install httpx2
      - name: Compile Python modules
        run: python -m compileall -q app.py server.py tests
      - name: Run API tests
        run: python -m unittest discover -s tests -v
